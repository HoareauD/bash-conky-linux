conky.config = {
    out_to_wayland = false,
    out_to_x = true,
    background = false,
    update_interval = 2,
    double_buffer = true,
    own_window = true,
    own_window_type = 'normal',
    own_window_argb_visual = true,
    own_window_argb_value = 0,
    own_window_transparent = true,
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    alignment = 'top_right',
    gap_x = 25,
    gap_y = 50,
    minimum_width = 280,
    maximum_width = 280,
    use_xft = true,
    font = 'DejaVu Sans:size=10',
    default_color = 'FFFFFF',
    color1 = '38BDF8',
    draw_shades = false,
    draw_outline = false,
};
conky.text = [[
${color1}${font DejaVu Sans:bold:size=15}SUPERVISION SYSTÈME${font}
${hr 2}${color}
${time %A %d %B %Y}
${font DejaVu Sans:bold:size=24}${time %H:%M:%S}${font}
${color1}SYSTÈME ${hr 1}${color}
Nom : ${nodename}
Distribution : Fedora
Noyau : ${kernel}
Durée active : ${execi 30 uptime -p}
${color1}PROCESSEUR ${hr 1}${color}
Utilisation : ${cpu} %
${cpubar 8}
${cpugraph 30,280 38BDF8 22C55E}
Fréquence : ${freq_g} GHz
${color1}MÉMOIRE VIVE ${hr 1}${color}
RAM : ${mem} / ${memmax} (${memperc} %)
${membar 8}
SWAP : ${swap} / ${swapmax}
${swapbar 8}
${color1}STOCKAGE ${hr 1}${color}
Système : ${fs_used /} / ${fs_size /}
${fs_bar 8 /}
Dossier personnel : ${fs_used /home} / ${fs_size /home}
${fs_bar 8 /home}
${color1}RÉSEAU ${hr 1}${color}
Interface : @NET@
Adresse IP : ${addr @NET@}
Réception : ${downspeed @NET@}/s
${downspeedgraph @NET@ 25,280}
Émission : ${upspeed @NET@}/s
${upspeedgraph @NET@ 25,280}
@BATTERY@
${color1}PROCESSUS ${hr 1}${color}
Total : ${processes} | Actifs : ${running_processes}
${top name 1} ${alignr}${top cpu 1} %
${top name 2} ${alignr}${top cpu 2} %
]];
